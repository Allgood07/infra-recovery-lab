name: Recovery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: '1.13.10'
          tofu_wrapper: false

      - name: Tool versions
        run: |
          node --version
          npm --version
          tofu version
          docker version --format 'Docker Engine {{.Server.Version}}'
      - name: Offline checks after dependency installation
        run: |
          npm ci
          npm run typecheck
          npm test
          node --test .github/scripts/check-recovery.test.mjs
      - name: Original volume — require exact value and cleanup
        run: node .github/scripts/check-recovery.mjs verify
      - name: Empty volume — require KEY_MISSING and cleanup
        run: node .github/scripts/check-recovery.mjs wrong-volume
